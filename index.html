<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LotoSmart - Requisição Personalizada</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #27ae60;
            --bg-color: #f4f7f6;
            --danger-color: #e74c3c;
            --gray-step: #95a5a6;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); margin: 0; padding: 10px; }
        .container { max-width: 650px; margin: auto; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: var(--primary-color); margin-bottom: 20px; font-size: 20px; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #34495e; font-size: 14px; }
        select, input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        
        .inventory-section { border-top: 2px solid #eee; padding-top: 15px; }
        
        /* Cabeçalho das Colunas */
        .column-header { display: flex; justify-content: flex-end; padding-bottom: 5px; border-bottom: 2px solid #f2f2f2; margin-bottom: 10px; gap: 10px; }
        .header-title { font-size: 10px; font-weight: bold; color: #7f8c8d; text-align: center; width: 115px; }

        .item-row { display: flex; align-items: center; padding: 10px 0; border-bottom: 1px solid #f9f9f9; gap: 10px; }
        
        /* Info do Item: Nome em cima, Média embaixo */
        .item-info { flex: 1; display: flex; flex-direction: column; min-width: 100px; }
        .item-name { font-size: 13px; color: #333; font-weight: 600; line-height: 1.2; }
        .item-media { font-size: 11px; color: #888; margin-top: 2px; font-style: italic; }
        
        /* Controles de Quantidade */
        .controls-container { display: flex; gap: 8px; flex-shrink: 0; }
        
        .qty-group { display: flex; align-items: center; gap: 2px; background: #f1f2f6; padding: 4px; border-radius: 6px; border: 1px solid #ddd; }
        /* Destaque para a coluna de Pedido */
        .qty-group.pedido-color { border-color: #d4edda; background-color: #f0fff4; }

        .btn-qty { 
            width: 28px; height: 28px; color: white; border: none; border-radius: 4px; 
            font-size: 16px; font-weight: bold; cursor: pointer; 
            display: flex; justify-content: center; align-items: center; flex-shrink: 0;
        }
        /* Botões de Estoque (Cinza) */
        .btn-estoque { background-color: var(--gray-step); }
        /* Botões de Pedido (Verde) */
        .btn-pedido { background-color: var(--accent-color); }
        
        .btn-qty:active { transform: scale(0.9); opacity: 0.8; }

        .item-qty { 
            width: 38px; padding: 4px 0; border: 1px solid #ccc; border-radius: 4px; 
            text-align: center; font-size: 14px; font-weight: bold; box-sizing: border-box;
            background: white;
        }

        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

        button#btnEnviar { 
            width: 100%; padding: 18px; background-color: var(--accent-color); color: white; 
            border: none; border-radius: 8px; font-size: 18px; font-weight: bold; 
            cursor: pointer; margin-top: 25px; box-shadow: 0 4px 10px rgba(39, 174, 96, 0.3);
        }
        .loading { display: none; text-align: center; color: var(--accent-color); font-weight: bold; margin-top: 10px; }
        .placeholder-text { text-align: center; color: #888; padding: 20px; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <h2>Requisição de Materiais</h2>
    
    <div class="form-group">
        <label>Localização Específica:</label>
        <select id="local" onchange="renderizarItens()">
            <option value="">Selecione o local...</option>
            
            <optgroup label="Praças">
                <option value="P1">Praça 01</option>
                <option value="P2">Praça 02</option>
                <option value="P3">Praça 03</option>
                <option value="P4">Praça 04</option>
                <option value="P5">Praça 05</option>
                <option value="P6">Praça 06</option>
                <option value="P7">Praça 07</option>
            </optgroup>

            <optgroup label="Bases">
                <option value="SAU1">SAU 01</option>
                <option value="SAU2">SAU 02</option>
                <option value="SAU3">SAU 03</option>
                <option value="SAU4">SAU 04</option>
                <option value="SAU5">SAU 05</option>
                <option value="SAU6">SAU 06</option>
                <option value="SAU7">SAU 07</option>
                <option value="SAU8">SAU 08</option>
                <option value="SAU9">SAU 09</option>
                <option value="SAU10">SAU 10</option>
                <option value="SAU11">SAU 11</option>
                <option value="SAU12">SAU 12</option>
            </optgroup>

            <optgroup label="PPVs">
                <option value="PPV1">PPV 01</option>
                <option value="PPV2">PPV 02</option>
                <option value="PPV3">PPV 03</option>
                <option value="PPV4">PPV 04</option>
            </optgroup>
        </select>
    </div>

    <div class="form-group">
        <label>Nome do Colaborador:</label>
        <input type="text" id="solicitante" placeholder="Digite seu nome completo">
    </div>

    <div class="inventory-section">
        <div class="column-header">
            <span class="header-title">ESTOQUE ATUAL</span>
            <span class="header-title" style="color: var(--accent-color);">PEDIDO NOVO</span>
        </div>
        <div id="lista-itens">
            <p class="placeholder-text">Escolha um local para carregar os dados.</p>
        </div>
    </div>

    <button id="btnEnviar" onclick="enviarParaPlanilha()">ENVIAR REQUISIÇÃO</button>
    <div id="msgStatus" class="loading">Enviando dados... Aguarde.</div>
</div>

</body>

    function renderizarItens() {
    const localCod = document.getElementById('local').value;
    const container = document.getElementById('lista-itens');
    container.innerHTML = '';

    if (!localCod) {
        container.innerHTML = '<p class="placeholder-text">Escolha um local para carregar os dados.</p>';
        return;
    }

    // 1. Identifica qual lista usar (Mantendo sua separação original)
    let lista;
    if (localCod.startsWith("P") && !localCod.startsWith("PPV")) {
        lista = listasPorTipo["PRACA"];
    } else if (localCod.startsWith("SAU")) {
        lista = listasPorTipo["BASE"];
    } else {
        lista = listasPorTipo["PPV"];
    }

    // 2. Busca as médias específicas do local selecionado
    const mediasDoLocal = matrizConsumo[localCod] || {};

    // 3. Gera o HTML para cada item da lista específica
    lista.forEach((item, index) => {
        // Busca a média. Se o nome na lista for ligeiramente diferente do da matriz, 
        // ele exibirá 0 em vez de quebrar o código.
        const mediaItem = mediasDoLocal[item] !== undefined ? mediasDoLocal[item] : 0;

        const div = document.createElement('div');
        div.className = 'item-row';
        div.innerHTML = `
            <div class="item-info">
                <span class="item-name">${item}</span>
                <span class="item-media">Sugestão (Média): ${mediaItem}</span>
            </div>
            <div class="controls-container">
                <div class="qty-group">
                    <button type="button" class="btn-qty btn-estoque" onclick="alterar('est-${index}', -1)">-</button>
                    <input type="number" id="est-${index}" class="item-qty input-estoque" data-name="${item}" value="0" min="0">
                    <button type="button" class="btn-qty btn-estoque" onclick="alterar('est-${index}', 1)">+</button>
                </div>
                <div class="qty-group pedido-color">
                    <button type="button" class="btn-qty btn-pedido" onclick="alterar('ped-${index}', -1)">-</button>
                    <input type="number" id="ped-${index}" class="item-qty input-pedido" data-name="${item}" value="0" min="0">
                    <button type="button" class="btn-qty btn-pedido" onclick="alterar('ped-${index}', 1)">+</button>
                </div>
            </div>
        `;
        container.appendChild(div);
    });
}

    function alterar(id, valor) {
        const campo = document.getElementById(id);
        let atual = parseInt(campo.value) || 0;
        let novoValor = atual + valor;
        if (novoValor >= 0 && novoValor <= 99) campo.value = novoValor;
    }

    async function enviarParaPlanilha() {
    const local = document.getElementById('local').value;
    const solicitante = document.getElementById('solicitante').value;
    const btn = document.getElementById('btnEnviar');
    const status = document.getElementById('msgStatus');

    if (!local || !solicitante) {
        alert("Preencha a Localização e seu Nome.");
        return;
    }

    btn.style.display = 'none';
    status.style.display = 'block';

    // 1. Iniciamos os dados básicos
    const dadosParaEnviar = {
        "data": new Date().toLocaleString('pt-BR'),
        "local": local,
        "solicitante": solicitante
    };

   // Coleta os itens com limpeza de espaços
    document.querySelectorAll('.item-row').forEach(row => {
        const nomeItemElement = row.querySelector('.item-name');
        if (nomeItemElement) {
            const nomeItem = nomeItemElement.innerText.trim(); // .trim() remove espaços invisíveis
            const estoque = row.querySelector('.input-estoque').value || "0";
            const pedido = row.querySelector('.input-pedido').value || "0";

            // Monta a chave exatamente como deve estar na planilha
            dadosParaEnviar[nomeItem + " (ESTOQUE)"] = estoque;
            dadosParaEnviar[nomeItem + " (PEDIDO)"] = pedido;
        }
    });

    // LOG PARA TESTE: Aperte F12 no navegador antes de enviar e veja se os nomes batem
    console.log("Objeto sendo enviado:", dadosParaEnviar);

    const URL_WEB_APP = "https://script.google.com/macros/s/AKfycbzrAIcSdnZ1VOUCNOdhdaFAnsTPbJhUtkIfY3QVetd-wedoiAgMIMKxfI0NOvHFTBU/exec"; 

    try {
        await fetch(URL_WEB_APP, { 
            method: 'POST', 
            mode: 'no-cors', 
            headers: { 'Content-Type': 'application/json' }, 
            body: JSON.stringify(dadosParaEnviar) 
        });
        alert("Requisição enviada com sucesso!");
        location.reload(); 
    } catch (error) {
        alert("Erro na conexão.");
        btn.style.display = 'block';
        status.style.display = 'none';
    }
}
</script>
